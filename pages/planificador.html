<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Planificador de estudio | TUPLUSEDUCA</title>
<meta name="description" content="Organiza tus días y horas de estudio y calcula tu fecha de término.">
<link rel="icon" href="../assets/colibri-mini.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&family=Fraunces:opsz,wght@9..144,600;9..144,700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../css/base.css">
<link rel="stylesheet" href="../css/componentes.css">
<link rel="stylesheet" href="../css/paginas.css">
<link rel="stylesheet" href="../css/animaciones.css">
<link rel="stylesheet" href="../css/responsive.css">
<link rel="stylesheet" href="../css/nuevo.css">
<script>try{var t=localStorage.getItem("tema")||(matchMedia("(prefers-color-scheme: light)").matches?"claro":"oscuro");document.documentElement.dataset.tema=t;if(sessionStorage.getItem("tp-trans"))document.documentElement.classList.add("llega")}catch(e){document.documentElement.dataset.tema="oscuro"}</script>
</head>
<body data-pagina="planificador" data-raiz="../">
<main class="plan-main">
  <div class="plan-app">
    <section class="pl-izq" aria-labelledby="pl-titulo">
      <button type="button" class="demo-pill grande" aria-pressed="false"><i aria-hidden="true"></i><span>Modo Demostración</span></button>
      <h1 id="pl-titulo">Planificador de Estudio</h1>
      <p class="pl-sub">Organiza tu tiempo de preparación</p>

      <div class="pl-campo">
        <label for="pl-prog">Programa</label>
        <select id="pl-prog"></select>
      </div>

      <fieldset class="pl-campo pl-dias">
        <legend>Selector de días</legend>
        <div id="pl-dias" class="dias-fila"></div>
        <small class="pl-ayuda" id="pl-dias-ayuda"></small>
      </fieldset>

      <div class="pl-campo">
        <label for="pl-horas">Horas de estudio diarias</label>
        <div class="rango"><output id="pl-bub" for="pl-horas">3 horas</output><input id="pl-horas" type="range" min="1" max="8" step="0.5" value="2"></div>
        <div class="rango-marcas" aria-hidden="true"><span>1 h</span><span>8 h</span></div>
      </div>

      <div class="pl-campo">
        <label for="pl-inicio">Fecha de inicio</label>
        <div class="fecha"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="5" width="18" height="16" rx="3"/><path d="M3 10h18M8 3v4M16 3v4"/></svg><input id="pl-inicio" type="date"></div>
      </div>

      <div class="pl-campo fila-dif">
        <span id="dif-l">Dificultad de Test</span>
        <div class="interruptores" role="group" aria-labelledby="dif-l">
          <button type="button" class="sw" role="switch" aria-checked="true" data-dif="basico"><i></i><span>Básico</span></button>
          <button type="button" class="sw" role="switch" aria-checked="false" data-dif="avanzado"><i></i><span>Avanzado</span></button>
        </div>
      </div>
      <small class="pl-ayuda" id="pl-dif-ayuda"></small>

      <div class="pl-campo">
        <label for="pl-cuotas">Forma de pago</label>
        <select id="pl-cuotas"><option value="1">1 pago</option><option value="3">3 cuotas</option><option value="6">6 cuotas</option></select>
      </div>
    </section>

    <section class="pl-der" aria-labelledby="pl-res" aria-live="polite">
      <h2 id="pl-res">Resumen del Plan de Estudio</h2>

      <div class="fin-card">
        <span class="fin-ico"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="5" width="18" height="16" rx="3"/><path d="M3 10h18M8 3v4M16 3v4"/></svg></span>
        <div><small>Fecha Estimada de Finalización</small><b id="pl-fin">–</b></div>
      </div>

      <div class="pl-bloque">
        <div class="pl-bloque-cab"><h3>Horario Semanal</h3><span class="tag-mini">Mini visual</span></div>
        <div class="horario" id="pl-horario"></div>
        <p class="horario-pie"><span id="pl-semanal">–</span><span id="pl-stats">–</span></p>
      </div>

      <div class="pl-bloque">
        <div class="pl-bloque-cab"><h3>Temario y Módulos</h3><span class="avance"><span id="pl-avance">0%</span><i><b id="pl-avance-b"></b></i></span></div>
        <ol class="tema" id="pl-mods"></ol>
      </div>

      <p class="pl-pago">Pago: <b id="pl-cuota">–</b></p>
      <div class="pl-botones">
        <button type="button" class="boton sec" id="pl-ics">Agregar al calendario (.ics)</button>
        <a class="boton" id="pl-ins" href="matricula.html">Inscribirme al Curso</a>
      </div>
      <div class="pl-extra"><button type="button" class="enlace-btn" id="pl-copiar">Copiar plan</button><button type="button" class="enlace-btn" id="pl-txt">Descargar plan (.txt)</button></div>
    </section>
  </div>
</main>

<script src="../js/datos.js"></script>
<script src="../js/utilidades.js"></script>
<script src="../js/transiciones.js"></script>
<script src="../js/colibri.js"></script>
<script src="../js/layout.js"></script>
<script src="../js/comun.js"></script>
<script src="../js/planificador.js"></script>
</body>
</html>
