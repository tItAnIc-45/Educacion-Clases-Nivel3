<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Programas | TUPLUSEDUCA</title>
<meta name="description" content="Explora los programas de tecnología, creatividad y negocios.">
<link rel="icon" href="../assets/colibri-mini.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&family=Fraunces:opsz,wght@9..144,600;9..144,700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../css/base.css">
<link rel="stylesheet" href="../css/componentes.css">
<link rel="stylesheet" href="../css/paginas.css">
<link rel="stylesheet" href="../css/animaciones.css">
<link rel="stylesheet" href="../css/responsive.css">
<link rel="stylesheet" href="../css/nuevo.css">
<script>try{var t=localStorage.getItem("tema")||(matchMedia("(prefers-color-scheme: light)").matches?"claro":"oscuro");document.documentElement.dataset.tema=t;if(sessionStorage.getItem("tp-trans"))document.documentElement.classList.add("llega")}catch(e){document.documentElement.dataset.tema="oscuro"}</script>
</head>
<body data-pagina="programas" data-raiz="../">
<main>
  <section class="cabecera">
    <p class="migas"><a href="../index.html">Inicio</a> / Programas</p>
    <h1>Programas</h1>
    <p class="lead">Busca por tema, docente o herramienta. Entra a cada programa para ver el temario, los docentes y lo que opinan los alumnos.</p>
  </section>
  <section class="seccion">
    <div class="buscador" role="search">
      <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><circle cx="11" cy="11" r="7" fill="none" stroke="currentColor" stroke-width="2"/><path d="m20 20-4-4" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
      <input id="buscar" type="search" autocomplete="off" placeholder="Prueba con “Excel”, “logo”, “Lucía” o “redes sociales”" aria-label="Buscar programa, tema o docente" aria-controls="cursos">
      <button type="button" id="limpiar" class="limpiar" aria-label="Borrar búsqueda" hidden>✕</button>
      <kbd aria-hidden="true">/</kbd>
    </div>
    <div class="sugerencias" id="sugerencias" aria-label="Búsquedas populares"></div>
    <div class="filtros" role="group" aria-label="Filtrar por área">
      <button class="filtro activo" data-f="todos">Todos <span class="cuenta-f" data-cf="todos"></span></button>
      <button class="filtro" data-f="Tecnología">Tecnología <span class="cuenta-f" data-cf="Tecnología"></span></button>
      <button class="filtro" data-f="Creatividad">Creatividad <span class="cuenta-f" data-cf="Creatividad"></span></button>
      <button class="filtro" data-f="Negocios">Negocios <span class="cuenta-f" data-cf="Negocios"></span></button>
      <button class="filtro" data-f="fav">♥ Favoritos <span class="cuenta-f" id="nfav">0</span></button>
    </div>
    <div class="herramientas">
      <label class="campo-mini">Nivel
        <select id="nivel"><option value="">Todos</option><option value="Inicial">Inicial</option><option value="Intermedio">Intermedio</option></select></label>
      <label class="campo-mini">Precio
        <select id="precio"><option value="">Cualquiera</option><option value="200">Hasta S/ 200</option><option value="230">Hasta S/ 230</option></select></label>
      <label class="campo-mini">Ordenar por
        <select id="orden">
          <option value="">Recomendado</option>
          <option value="val">Mejor valorados</option>
          <option value="al">Más estudiantes</option>
          <option value="p-asc">Precio: menor a mayor</option>
          <option value="p-desc">Precio: mayor a menor</option>
          <option value="h-asc">Duración: más corta primero</option>
        </select></label>
      <button type="button" class="boton sec" id="reiniciar" hidden>Quitar filtros</button>
      <small id="total" aria-live="polite"></small>
    </div>
    <div class="cursos" id="cursos"></div>
    <div class="vacio-caja" id="vacio" hidden>
      <h3>No encontramos programas con esa búsqueda</h3>
      <p>Revisa la ortografía o prueba con una de estas ideas:</p>
      <div class="sugerencias" id="sug-vacio"></div>
    </div>
  </section>
</main>

<script src="../js/datos.js"></script>
<script src="../js/utilidades.js"></script>
<script src="../js/transiciones.js"></script>
<script src="../js/colibri.js"></script>
<script src="../js/layout.js"></script>
<script src="../js/comun.js"></script>
<script src="../js/programas.js"></script>
</body>
</html>
